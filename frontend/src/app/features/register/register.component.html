<section class="auth-page py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-lg-11">
        <div class="card shadow-sm border-0 auth-card overflow-hidden fade-rise">
          <div class="row g-0">
            <div class="col-lg-5 auth-visual d-none d-lg-flex">
              <div class="visual-inner">
                <h3 class="text-white fw-bold">Creer votre espace</h3>
                <p class="text-white-50 mb-0">
                  Demarrez votre parcours de vente et d'achat durable.
                </p>
              </div>
            </div>

            <div class="col-lg-7">
              <div class="card-body p-4 p-md-5">
                <h2 class="h4 fw-bold mb-1">Creation de compte</h2>

                <p class="text-muted mb-4">Rejoignez la communaute EcoMarketplace.</p>

                <div class="mini-banner mb-4">
                  <button type="button" class="btn btn-light social-btn w-100">
                    <span class="google-dot"></span>
                    Continue with Google
                  </button>
                </div>

                @if (successMessage) {
                  <div class="alert alert-success">
                    {{ successMessage }}
                  </div>
                }

                @if (errorMessage) {
                  <div class="alert alert-danger">
                    {{ errorMessage }}
                  </div>
                }

                <form
                  [formGroup]="form"
                  (ngSubmit)="submit()"
                  novalidate
                  autocomplete="off"
                  class="register-form"
                >
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Prenom</label>

                      <input class="form-control" formControlName="firstName" />
                    </div>

                    <div class="col-md-6">
                      <label class="form-label">Nom</label>

                      <input class="form-control" formControlName="lastName" />
                    </div>

                    <div class="col-md-6">
                      <label class="form-label">Email</label>

                      <input type="email" class="form-control" formControlName="email" />
                    </div>

                    <div class="col-md-6">
                      <label class="form-label">Mot de passe</label>

                      <input
                        type="password"
                        class="form-control"
                        formControlName="password"
                        autocomplete="new-password"
                        placeholder="Entrez un mot de passe"
                      />
                    </div>

                    <div class="col-12">
                      <label class="form-label"> Type de compte </label>

                      <select class="form-select" formControlName="role">
                        @for (item of accountRoles; track item.value) {
                          <option [value]="item.value">
                            {{ item.label }}
                          </option>
                        }
                      </select>

                      <small class="text-muted">
                        Ce choix determine votre role apres connexion.
                      </small>
                    </div>
                  </div>

                  <button class="btn btn-success w-100 mt-4" type="submit" [disabled]="loading">
                    {{ loading ? 'Creation...' : 'Creer mon compte' }}
                  </button>
                </form>

                <p class="mt-3 mb-0 text-center">
                  Deja inscrit ?
                  <a [routerLink]="['/login']"> Se connecter </a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
