<section class="auth-page py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card auth-card border-0 shadow-sm fade-rise">
          <div class="card-body p-4 p-md-5">
            <h2 class="h4 fw-bold mb-1">Reinitialiser le mot de passe</h2>
            <p class="text-muted mb-4">Entrez votre email pour recevoir un lien de reinitialisation.</p>

            @if (sent) {
              <div class="alert alert-success">
                Si cet email existe, un lien de reinitialisation a ete envoye.
              </div>
            }

            <form [formGroup]="form" (ngSubmit)="submit()" novalidate autocomplete="off">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" formControlName="email" autocomplete="email" placeholder="vous@email.com">
              </div>
              <button class="btn btn-success w-100" type="submit">Envoyer le lien</button>
            </form>

            <p class="mt-3 mb-0 text-center">
              Retour a <a [routerLink]="['/login']">Connexion</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
